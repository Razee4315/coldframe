# coldframe: distributed Remotion render on GitHub Actions.
#
# plan    bundles the project once and splits the frames into N ranges
# chunk   renders one frame range per runner, all in parallel: video plus a
#         lossless PCM slice of the audio, so the joins are sample-exact
# stitch  joins the chunks without re-encoding the video, encodes the audio
#         once, verifies the frame count and uploads the MP4 as an artifact
#
# Call it from any Remotion repo:
#   jobs:
#     render:
#       uses: Razee4315/coldframe/.github/workflows/render.yml@v1
#       with: { composition: MyComp, chunks: 8 }

name: coldframe render

on:
  workflow_call:
    inputs:
      composition:
        description: Composition id to render
        type: string
        required: true
      chunks:
        description: Number of parallel render machines (1-20)
        type: number
        default: 8
      project-dir:
        description: Folder containing the Remotion project (package.json)
        type: string
        default: "."
      entry-point:
        description: Remotion entry file, relative to project-dir (blank = auto)
        type: string
        default: ""
      props:
        description: JSON input props
        type: string
        default: "{}"
      output-name:
        description: File name of the final MP4 (blank = <composition>-<run>.mp4)
        type: string
        default: ""
      frame-timeout:
        description: Milliseconds one frame may take before Remotion gives up (heavy WebGL on CPU needs more)
        type: number
        default: 120000
      gl:
        description: OpenGL backend for Chrome (swangle works on CPU-only runners; needed for three.js/WebGL)
        type: string
        default: swangle
      concurrency:
        description: Remotion --concurrency per machine
        type: string
        default: "100%"
      extra-args:
        description: Extra flags passed to every `remotion render` (e.g. --crf=16)
        type: string
        default: ""
      min-frames-per-chunk:
        description: Never make a chunk shorter than this
        type: number
        default: 60
      chunk-timeout:
        description: Minutes one machine may render before it is stopped (GitHub's default is 6 hours)
        type: number
        default: 60
      node-version:
        type: string
        default: "22"
    outputs:
      artifact:
        description: Name of the artifact holding the final MP4
        value: ${{ jobs.stitch.outputs.artifact }}

env:
  FORCE_COLOR: "0"

# Reads the repo, nothing else. No secrets are used.
permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
      fps: ${{ steps.plan.outputs.fps }}
      size: ${{ steps.plan.outputs.size }}
      started: ${{ steps.plan.outputs.started }}
    steps:
      - id: clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with: { lfs: true }
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.project-dir }}/package-lock.json
      - name: Install Chrome dependencies
        run: &linuxdeps |
          libs="libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgbm1 libasound2t64
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libcups2t64
            libpango-1.0-0 libcairo2 fonts-noto-color-emoji"
          # GitHub's image ships Chrome, so these are usually installed already.
          if dpkg -s $libs > /dev/null 2>&1; then echo "Chrome libraries already installed"; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $libs > /dev/null
      - name: Install project
        working-directory: ${{ inputs.project-dir }}
        run: &install |
          npm ci --no-audit --no-fund
          # npm often drops other-platform optional binaries from lockfiles made on
          # Windows/macOS (npm/cli#4828). Add the Linux ones if they are missing.
          fix() { # $1 = package whose version to match, $2 = linux package
            [ -f "node_modules/$1/package.json" ] || return 0
            [ -d "node_modules/$2" ] && return 0
            v=$(node -p "require('./node_modules/$1/package.json').version")
            echo "Adding missing $2@$v"; npm i --no-save --no-audit --no-fund "$2@$v"
          }
          fix @rspack/binding @rspack/binding-linux-x64-gnu
          fix @remotion/renderer @remotion/compositor-linux-x64-gnu
      - name: Bundle
        working-directory: ${{ inputs.project-dir }}
        env:
          ENTRY: ${{ inputs.entry-point }}
        run: npx remotion bundle $ENTRY --out-dir=coldframe-bundle
      - name: Split frames
        id: plan
        working-directory: ${{ inputs.project-dir }}
        env:
          COMPOSITION: ${{ inputs.composition }}
          CHUNKS: ${{ inputs.chunks }}
          MIN_FRAMES: ${{ inputs.min-frames-per-chunk }}
          PROPS: ${{ inputs.props }}
          GL: ${{ inputs.gl }}
          STARTED: ${{ steps.clock.outputs.started }}
        run: |
          node - <<'EOF'
          const path = require("path");
          const fs = require("fs");
          const req = require("module").createRequire(path.resolve("package.json"));
          const { selectComposition } = req("@remotion/renderer");
          (async () => {
            const comp = await selectComposition({
              serveUrl: path.resolve("coldframe-bundle"),
              id: process.env.COMPOSITION,
              inputProps: JSON.parse(process.env.PROPS || "{}"),
              chromiumOptions: { gl: process.env.GL || null },
            });
            const total = comp.durationInFrames;
            const want = Math.max(1, Math.min(20, Number(process.env.CHUNKS) || 1));
            const n = Math.max(1, Math.min(want, Math.floor(total / Math.max(1, Number(process.env.MIN_FRAMES) || 1))));
            const per = Math.ceil(total / n);
            const include = [];
            for (let i = 0, start = 0; start < total; i++, start += per) {
              include.push({ index: String(i).padStart(2, "0"), start, end: Math.min(total, start + per) - 1 });
            }
            const out = [
              `matrix=${JSON.stringify({ include })}`,
              `total=${total}`,
              `fps=${comp.fps}`,
              `size=${comp.width}x${comp.height}`,
              `started=${process.env.STARTED}`,
            ];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
            console.log(`${comp.id}: ${total} frames @ ${comp.fps} fps, ${comp.width}x${comp.height} -> ${include.length} chunks`);
            console.table(include);
          })().catch((e) => { console.error(e); process.exit(1); });
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: coldframe-bundle
          path: ${{ inputs.project-dir }}/coldframe-bundle
          retention-days: 1
          include-hidden-files: true

  chunk:
    name: Chunk ${{ matrix.index }} (${{ matrix.start }}-${{ matrix.end }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.chunk-timeout }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true }
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.project-dir }}/package-lock.json
      - name: Install Chrome dependencies
        run: *linuxdeps
      - name: Install project
        working-directory: ${{ inputs.project-dir }}
        run: *install
      - uses: actions/download-artifact@v8
        with:
          name: coldframe-bundle
          path: ${{ inputs.project-dir }}/coldframe-bundle
      - name: Render
        working-directory: ${{ inputs.project-dir }}
        env:
          COMPOSITION: ${{ inputs.composition }}
          PROPS: ${{ inputs.props }}
          RANGE: ${{ matrix.start }}-${{ matrix.end }}
          INDEX: ${{ matrix.index }}
          GL: ${{ inputs.gl }}
          CONCURRENCY: ${{ inputs.concurrency }}
          FRAME_TIMEOUT: ${{ inputs.frame-timeout }}
          EXTRA_ARGS: ${{ inputs.extra-args }}
        run: |
          mkdir -p coldframe-out
          # Matroska + 16-bit PCM: each chunk carries its exact slice of the
          # soundtrack, and PCM slices join sample-exactly (no clicks, no gaps).
          # $EXTRA_ARGS is unquoted on purpose so "--crf=16 --scale=0.5" becomes two flags.
          npx remotion render coldframe-bundle "$COMPOSITION" "coldframe-out/chunk-$INDEX.mkv" \
            --codec=h264-mkv --audio-codec=pcm-16 --frames="$RANGE" --props="$PROPS" \
            --gl="$GL" --concurrency="$CONCURRENCY" --timeout="$FRAME_TIMEOUT" $EXTRA_ARGS
      - uses: actions/upload-artifact@v7
        with:
          name: coldframe-part-${{ matrix.index }}
          path: ${{ inputs.project-dir }}/coldframe-out/*
          retention-days: 1
          compression-level: 0

  stitch:
    name: Stitch + deliver
    needs: [plan, chunk]
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - id: name
        env:
          OUT: ${{ inputs.output-name }}
          COMP: ${{ inputs.composition }}
          RUN: ${{ github.run_number }}
        run: |
          file="${OUT:-$COMP-$RUN}"
          # Artifact names can't contain these characters, and the file always ends in .mp4.
          file="$(printf '%s' "${file%.mp4}" | tr '/\\:*?"<>|' '_').mp4"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "artifact=${file%.mp4}" >> "$GITHUB_OUTPUT"
      # Remotion ships its own ffmpeg/ffprobe; installing the project (cached) is
      # much faster than apt-get install ffmpeg.
      - uses: actions/checkout@v7
        with: { lfs: false, sparse-checkout: "${{ inputs.project-dir }}" }
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.project-dir }}/package-lock.json
      - name: Install project
        working-directory: ${{ inputs.project-dir }}
        run: *install
      - uses: actions/download-artifact@v8
        with:
          pattern: coldframe-part-*
          path: ${{ github.workspace }}/parts
          merge-multiple: true
      - name: Join chunks and mux audio
        working-directory: ${{ inputs.project-dir }}
        env:
          FILE: ${{ steps.name.outputs.file }}
          TOTAL: ${{ needs.plan.outputs.total }}
        run: |
          set -euo pipefail
          ffmpeg() { npx remotion ffmpeg "$@"; }
          ffprobe() { npx remotion ffprobe "$@"; }
          P="$GITHUB_WORKSPACE/parts"; F="$GITHUB_WORKSPACE/final"
          ls -la "$P"
          for f in "$P"/chunk-*.mkv; do echo "file '$f'"; done | sort > list.txt
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i list.txt -c copy joined.mkv
          mkdir -p "$F"
          # Video is copied untouched; the joined PCM track is encoded to AAC once.
          ffmpeg -hide_banner -loglevel error -y -i joined.mkv -map 0:v:0 -map "0:a:0?" \
            -c:v copy -c:a aac -b:a 320k -movflags +faststart "$F/$FILE"
          rm -f joined.mkv list.txt
          frames=$(ffprobe -v error -select_streams v:0 -count_packets -show_entries stream=nb_read_packets -of default=nw=1:nk=1 "$F/$FILE" | tr -dc 0-9)
          echo "Frames in output: $frames (expected $TOTAL)"
          if [ "$frames" != "$TOTAL" ]; then echo "::error::Frame count mismatch: $frames != $TOTAL"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: final/${{ steps.name.outputs.file }}
          compression-level: 0
      - name: Summary
        env:
          FILE: ${{ steps.name.outputs.file }}
          STARTED: ${{ needs.plan.outputs.started }}
          TOTAL: ${{ needs.plan.outputs.total }}
          FPS: ${{ needs.plan.outputs.fps }}
          SIZE: ${{ needs.plan.outputs.size }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          COMP: ${{ inputs.composition }}
          RUN_ID: ${{ github.run_id }}
        run: |
          secs=$(( $(date +%s) - STARTED ))
          chunks=$(echo "$MATRIX" | jq '.include | length')
          mb=$(du -m "final/$FILE" | cut -f1)
          {
            echo "## coldframe render finished"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Composition | \`$COMP\` ($SIZE, $FPS fps) |"
            echo "| Frames | $TOTAL ($(awk "BEGIN{printf \"%.1f\", $TOTAL/$FPS}") s of video) |"
            echo "| Machines | $chunks in parallel |"
            echo "| Wall time | $((secs/60)) min $((secs%60)) s |"
            echo "| Output | \`$FILE\` ($mb MB), artifact \`${FILE%.mp4}\` |"
            echo
            echo "Download: \`npx github:Razee4315/coldframe download $RUN_ID\`, or **Artifacts** below."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
