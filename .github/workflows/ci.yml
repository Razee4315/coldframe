# Quick checks of the CLI on every push: it parses, prints help, rejects bad input,
# and `init` copies the workflow. Nothing here signs in to GitHub or starts a render.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    name: CLI (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: ["18", "22"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Check the CLI
        run: |
          set -u
          CLI="$PWD/bin/coldframe.mjs"
          fail() { echo "::error::$1"; exit 1; }
          # expect <exit code> <text in output> -- <args>
          expect() {
            code=$1; text=$2; shift 3
            out=$(node "$CLI" "$@" 2>&1); got=$?
            [ "$got" = "$code" ] || fail "coldframe $* exited $got, expected $code: $out"
            case "$out" in *"$text"*) ;; *) fail "coldframe $* did not print \"$text\": $out" ;; esac
            echo "ok: coldframe $*"
          }

          node --check "$CLI"
          expect 0 "coldframe setup" -- --help
          expect 0 "$(node -p 'require("./package.json").version')" -- -v
          expect 1 'unknown command "nope"' -- nope
          expect 1 "usage: coldframe render" -- render
          expect 1 "--chunks must be a whole number" -- render Comp --chunks 50
          expect 1 "--props must be JSON" -- render Comp --props '{bad'
          expect 1 "--chunks needs a value" -- render Comp --chunks

          # init copies the workflow into a fresh project, and leaves an existing one alone.
          dir=$(mktemp -d); cd "$dir"; echo '{}' > package.json
          expect 0 "added .github" -- init
          cmp .github/workflows/coldframe.yml "$GITHUB_WORKSPACE/templates/coldframe.yml" || fail "init copied the wrong file"
          expect 0 "already there" -- init
